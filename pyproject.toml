[project]
name = "mcp-vision"
version = "1.0.0"
description = "MCP Server for image recognition - OCR and visual analysis via multimodal APIs, enables image understanding for text-only AI coding tools like Claude Code + DeepSeek"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "hahahahanb" },
]
urls.Repository = "https://github.com/hahahahanb/mcp-vision"
dependencies = [
    "httpx>=0.28.1",
    "mcp[cli]>=1.27.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
mcp-vision = "mcp_ocr.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_ocr"]
